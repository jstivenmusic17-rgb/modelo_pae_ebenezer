# Perfil de demostracion: base de datos en memoria con los datos de ejemplo
# del documento del proyecto. Se activa SOLO con el perfil "demo":
#   mvn spring-boot:run -Dspring-boot.run.profiles=demo
#   (IntelliJ: Run configuration -> Active profiles -> demo)
# Sin ese perfil la aplicacion usa PostgreSQL (application.properties).
# Los datos se pierden al detener la aplicacion.

server.port=8082

spring.datasource.url=jdbc:h2:mem:pae;INIT=CREATE SCHEMA IF NOT EXISTS pae;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=pae
